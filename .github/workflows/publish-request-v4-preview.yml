name: Publish Request v4 preview to GitHub Pages

on:
  push:
    branches:
      - feat/request-architecture-v4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout Request v4
        uses: actions/checkout@v4
        with:
          ref: feat/request-architecture-v4
          path: preview

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build current production exactly from main
        working-directory: production
        run: |
          node scripts/build.cjs
          node stitch-v2/build.cjs
          node motion-v3/build.cjs

      - name: Build Request v4
        working-directory: preview
        run: node scripts/build.cjs

      - name: Add preview under its own URL
        run: |
          rm -rf production/dist/request-v4-preview
          mkdir -p production/dist/request-v4-preview
          cp -a preview/dist/. production/dist/request-v4-preview/

      - name: Keep preview out of search indexes
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("production/dist/request-v4-preview")
          marker = '<meta name="robots" content="noindex,nofollow,noarchive">'
          for html in root.rglob("*.html"):
              s = html.read_text(encoding="utf-8")
              if marker not in s:
                  s = s.replace("<head>", "<head>\n  " + marker, 1)
                  html.write_text(s, encoding="utf-8")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish preview without changing main
        id: deployment
        uses: actions/deploy-pages@v4
