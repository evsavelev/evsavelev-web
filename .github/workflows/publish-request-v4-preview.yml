name: Publish Request v4 preview

on:
  push:
    branches:
      - feat/request-architecture-v4
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-request-v4-preview
  cancel-in-progress: true

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build preview
        run: node scripts/build.cjs

      - name: Publish dist to preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b preview-request-v4
          git add -A
          git commit -m "Publish Request v4 preview"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:preview-request-v4
